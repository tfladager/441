<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>First Breath — A Living Ranch Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
  <style>
:root {
  --soil: #3b2a1a; --bark: #5c3d20; --straw: #c9a96e;
  --cream: #f0e6cc; --sage: #7a8c6e; --sage-light: #a8b89a;
  --dawn: #d4956a; --dusk: #8b5e3c; --sky: #b8cfc4;
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:#3b2a1a; }
#canvas {
  position:relative; width:100vw; height:100vh;
  background: radial-gradient(ellipse at 30% 60%, #4a3220 0%, #2b1d10 50%, #1a1008 100%);
  overflow:hidden;
}
#grain {
  position:absolute; inset:0; opacity:0.35; pointer-events:none; z-index:1;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
}
.shape { position:absolute; opacity:0; z-index:2; }
#shape-a { width:180px; height:180px; top:10%; left:5%; background:radial-gradient(circle, var(--dawn) 0%, transparent 70%); border-radius:50%; filter:blur(2px); }
#shape-b { width:120px; height:120px; bottom:15%; right:8%; background:var(--sage); border-radius:50%; }
#shape-c { width:0; height:0; bottom:20%; left:12%; border-left:50px solid transparent; border-right:50px solid transparent; border-bottom:86px solid var(--straw); filter:blur(1px); }
#img-frame {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  width:420px; max-width:55vw; z-index:5;
  border:3px solid var(--straw);
  box-shadow:0 0 60px rgba(0,0,0,0.7), 0 0 120px rgba(60,30,10,0.4);
  display:none; overflow:hidden;
}
#img-frame img { width:100%; height:300px; object-fit:cover; display:block; filter:sepia(20%) contrast(1.05) brightness(0.95); }
#img-frame-2 {
  position:absolute; top:15%; right:6%; width:200px; max-width:25vw;
  z-index:4; border:2px solid var(--bark);
  box-shadow:0 0 30px rgba(0,0,0,0.5); display:none; overflow:hidden;
}
#img-frame-2 img { width:100%; height:160px; object-fit:cover; filter:sepia(30%) contrast(1.1) brightness(0.9); }
#title-block { position:absolute; top:6%; left:50%; transform:translateX(-50%); text-align:center; z-index:10; }
#title-top { display:block; font-family:'Playfair Display',serif; font-size:clamp(2.2rem,5vw,4rem); font-style:italic; color:var(--cream); letter-spacing:0.04em; text-shadow:0 2px 20px rgba(0,0,0,0.6); }
#title-sub { display:block; font-family:'Libre Baskerville',serif; font-size:clamp(0.75rem,1.5vw,1rem); color:var(--straw); letter-spacing:0.35em; text-transform:lowercase; margin-top:4px; opacity:0.85; }
#text-display { position:absolute; bottom:22%; left:50%; transform:translateX(-50%); width:70%; max-width:600px; text-align:center; z-index:10; }
#main-text { font-family:'Playfair Display',serif; font-size:clamp(1rem,2.2vw,1.5rem); color:var(--cream); line-height:1.6; font-style:italic; text-shadow:0 2px 12px rgba(0,0,0,0.8); display:none; }
#dimension-label { position:absolute; top:50%; left:3%; transform:translateY(-50%) rotate(-90deg); z-index:10; }
#dim-name { font-family:'Libre Baskerville',serif; font-size:0.75rem; letter-spacing:0.3em; text-transform:uppercase; color:var(--sage-light); opacity:0; }
#footer-bar { position:absolute; bottom:0; left:0; right:0; height:42px; background:rgba(30,18,8,0.85); border-top:1px solid var(--bark); display:flex; align-items:center; justify-content:center; z-index:20; }
#footer-bar span { font-family:'Libre Baskerville',serif; font-size:0.7rem; letter-spacing:0.25em; color:var(--straw); opacity:0.7; text-transform:uppercase; }
#canvas::before { content:''; position:absolute; width:500px; height:500px; border-radius:50%; background:radial-gradient(circle, rgba(201,169,110,0.08) 0%, transparent 70%); top:-100px; right:-100px; pointer-events:none; z-index:0; animation:glowPulse 8s ease-in-out infinite; }
#canvas::after { content:''; position:absolute; width:400px; height:400px; border-radius:50%; background:radial-gradient(circle, rgba(122,140,110,0.07) 0%, transparent 70%); bottom:-80px; left:-80px; pointer-events:none; z-index:0; animation:glowPulse 10s ease-in-out infinite reverse; }
@keyframes glowPulse { 0%,100% { opacity:0.5; transform:scale(1); } 50% { opacity:1; transform:scale(1.1); } }
  </style>
</head>

    var $frame = $("#img-frame"), $img = $("#main-img");
    var startLeft = Math.floor(Math.random()*40)+25;
    var startTop  = Math.floor(Math.random()*30)+30;
    $frame.css({left:startLeft+"%", top:startTop+"%", display:"block", opacity:0});
    $frame.stop(true).fadeIn(1400, function() {
      $frame.animate(
        {left:(startLeft+(Math.random()*6-3))+"%", top:(startTop+(Math.random()*5-2.5))+"%"},
        {duration:4500, easing:"swing", complete:function() {
          $frame.fadeOut(1400, function() {
            imgIndex = (imgIndex+1) % images.length;
            $img.attr("src", images[imgIndex]);
            setTimeout(cycleMainImage, 600);
          });
        }}
      );
    });
  }

  function cycleSecondaryImage() {
    var $frame = $("#img-frame-2"), $img = $("#secondary-img");
    var rightPos = Math.floor(Math.random()*15)+3;
    var topPos   = Math.floor(Math.random()*35)+12;
    $frame.css({right:rightPos+"%", top:topPos+"%", display:"block", opacity:0});
    $frame.stop(true).fadeIn(1800, function() {
      $frame.animate(
        {top:(topPos+(Math.random()*5-2.5))+"%"},
        {duration:5500, easing:"swing", complete:function() {
          $frame.fadeOut(1500, function() {
            img2Index = (img2Index+1) % images2.length;
            $img.attr("src", images2[img2Index]);
            setTimeout(cycleSecondaryImage, 1000);
          });
        }}
      );
    });
  }

  setTimeout(cycleMainImage, 400);
  setTimeout(cycleSecondaryImage, 2200);

  const texts = [
    "You don't always know what's about to come into the world. You wait. You breathe.",
    "No rancher pulls a calf alone. Someone holds the lantern.",
    "Your hands know what to do. They've done this before. Trust them.",
    "Every birth teaches something the books didn't cover.",
    "There is a moment — still, quiet — when it breathes for the first time.",
    "This is the work. Cold hands, early hours, and something that lives because you stayed.",
    "The mud, the straw, the frozen air — this is where life insists on arriving.",
    "You don't count the cost while you're in the barn. That comes later. Right now, you just help.",
  ];
  const dimensions = ["Emotional","Social","Physical","Intellectual","Spiritual","Occupational","Environmental","Financial"];
  let textIndex = 0;

  function showText() {
    var $p = $("#main-text"), $dim = $("#dim-name");
    var baseBottom = Math.floor(Math.random()*10)+18;
    $("#text-display").css("bottom", baseBottom+"%");
    $p.text(texts[textIndex]); $dim.text(dimensions[textIndex]);
    $p.stop(true).css({display:"block",opacity:0}).animate({opacity:1},1000);
    $dim.stop(true).css({opacity:0}).animate({opacity:0.85},1200);
    $("#text-display").animate({bottom:(baseBottom+2)+"%"},{duration:4500,easing:"swing"});
    setTimeout(function() {
      $p.animate({opacity:0},800,function() {
        $dim.animate({opacity:0},400);
        textIndex = (textIndex+1) % texts.length;
        setTimeout(showText, 600);
      });
    }, 4000);
  }
  setTimeout(showText, 1000);

  const shapeAStyles = [
    {background:"radial-gradient(circle, #c04a20 0%, transparent 70%)", width:"220px", height:"220px", borderRadius:"50%", filter:"blur(4px)", top:"8%", left:"3%"},
    {background:"radial-gradient(circle, #c9a96e 0%, transparent 70%)", width:"170px", height:"170px", borderRadius:"50%", filter:"blur(2px)", top:"12%", left:"8%"},
    {background:"radial-gradient(circle, #7a8c6e 0%, transparent 70%)",  width:"130px", height:"130px", borderRadius:"50%", filter:"blur(1px)", top:"10%", left:"6%"},
  ];
  const shapeBStyles = [
    {background:"#3b2a1a", width:"140px", height:"80px",  borderRadius:"50%", bottom:"18%", right:"6%",  boxShadow:"0 0 30px rgba(60,20,0,0.6)"},
    {background:"#5c3d20", width:"110px", height:"110px", borderRadius:"50%", bottom:"16%", right:"9%",  boxShadow:"0 0 20px rgba(90,60,20,0.5)"},
    {background:"#a8b89a", width:"90px",  height:"90px",  borderRadius:"50%", bottom:"14%", right:"12%", boxShadow:"0 0 15px rgba(160,185,150,0.4)"},
  ];
  const shapeCStyles = [
    {borderLeft:"60px solid transparent", borderRight:"60px solid transparent", borderBottom:"104px solid #8b3a1a", left:"10%", bottom:"28%", filter:"blur(0px)"},
    {borderLeft:"40px solid transparent", borderRight:"40px solid transparent", borderBottom:"70px solid #c9a96e",  left:"13%", bottom:"25%", filter:"blur(1px)"},
    {borderLeft:"25px solid transparent", borderRight:"25px solid transparent", borderBottom:"44px solid #7a8c6e",  left:"15%", bottom:"22%", filter:"blur(2px)"},
  ];
  let shapeIndex = 0;

  function cycleShapes() {
    var sA = shapeAStyles[shapeIndex % 3], sB = shapeBStyles[shapeIndex % 3], sC = shapeCStyles[shapeIndex % 3];
    $("#shape-a").stop(true).animate({opacity:0},700,function() {
      $("#shape-a").css(sA).css({opacity:0}).animate({opacity:0.75},1000);
      $("#shape-a").animate({top:(parseInt(sA.top)+3)+"%"},{duration:3500,easing:"swing"});
    });
    $("#shape-b").stop(true).animate({opacity:0},600,function() {
      $("#shape-b").css({background:sB.background,width:sB.width,height:sB.height,borderRadius:sB.borderRadius,boxShadow:sB.boxShadow,opacity:0,bottom:sB.bottom,right:sB.right});
      $("#shape-b").animate({opacity:0.7},1000);
      $("#shape-b").animate({bottom:(parseInt(sB.bottom)+4)+"%"},{duration:4000,easing:"swing"});
    });
    $("#shape-c").stop(true).animate({opacity:0},500,function() {
      $("#shape-c").css({borderLeft:sC.borderLeft,borderRight:sC.borderRight,borderBottom:sC.borderBottom,left:sC.left,bottom:sC.bottom,filter:sC.filter,background:"transparent",width:0,height:0,borderRadius:0,opacity:0});
      $("#shape-c").animate({opacity:0.65},1000);
    });
    shapeIndex++;
    setTimeout(cycleShapes, 3500);
  }

  $("#shape-a").css(shapeAStyles[0]).animate({opacity:0.7},1500);
  $("#shape-b").css(shapeBStyles[0]).animate({opacity:0.6},1800);
  $("#shape-c").css(shapeCStyles[0]).animate({opacity:0.55},2000);
  setTimeout(cycleShapes, 4000);

});
</script>
</body>
</html>
