<!DOCTYPE html>
<html lang="en">
<head>
    <title>Page 2</title>
</head>
<body>

<div id="output"></div>

<script>
function showItems() {
  var params = new URLSearchParams(location.search);
  var list = params.get("list");

  var itemsArray = list.split(",");

  var result = "";
  for (var i = 0; i < itemsArray.length; i++) {
    result += itemsArray[i] + "<br>";
  }

  document.getElementById("output").innerHTML = result;
}

showItems();
</script>

</body>
</html>
