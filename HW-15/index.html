<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blob World</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0010; overflow: hidden; font-family: sans-serif; }
    canvas { display: block; }
    #info {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.35);
      font-size: 13px;
      letter-spacing: 0.1em;
      pointer-events: none;
    }
    #plop-msg {
      position: absolute;
      top: 40%;
      left: 50%;
      color: white;
      font-size: 3rem;
      font-weight: bold;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 30px rgba(255,180,255,1), 0 0 60px rgba(255,100,255,0.6);
      transform: translate(-50%, -50%) scale(0.2);
    }
    @keyframes plop-anim {
      0%   { transform: translate(-50%, -50%) scale(0.2);               opacity: 0; }
      25%  { transform: translate(-50%, -50%) scale(1.8);               opacity: 1; }
      50%  { transform: translate(-50%, -50%) scaleX(1.3) scaleY(0.45); opacity: 1; }
      65%  { transform: translate(-50%, -50%) scaleX(0.9) scaleY(1.2);  opacity: 1; }
      80%  { transform: translate(-50%, -50%) scale(1.05);              opacity: 1; }
      90%  { transform: translate(-50%, -50%) scale(1.0);               opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.0);               opacity: 0; }
    }
    #plop-msg.playing {
      animation: plop-anim 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body>
  <div id="plop-msg">✦ plop ✦</div>
  <div id="info">blob world — watch &amp; wait</div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
