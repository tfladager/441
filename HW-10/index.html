<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weird & Wonderful US Place Names</title>
 
  /*standard template for starting code*/

  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

// google fonts and the jquery to run before the script runs.

  <style>
    :root {
      --cream:    #f5f0e8;
      --ink:      #1a1208;
      --rust:     #c0390b;
      --gold:     #d4a017;
      --sage:     #5a7a5a;
      --card-bg:  #fffdf7;
      --back-bg:  #1a1208;
      --shadow:   rgba(26, 18, 8, 0.18);
      --highlight-bg: #fff3b0;
      --highlight-border: #d4a017;
    }

    /*color palette to use everywhere */

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--cream);
      background-image:
        repeating-linear-gradient(
          0deg, transparent, transparent 28px,
          rgba(180,160,120,0.08) 28px, rgba(180,160,120,0.08) 29px
        );
      color: var(--ink);
      font-family: 'Lora', Georgia, serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /*this is creating the background layout*/

    header {
      text-align: center;
      max-width: 720px;
      margin: 0 auto 3rem;
      padding-bottom: 1.5rem;
      border-bottom: 3px double var(--rust);
    }

    header h1 {
      font-family: 'Abril Fatface', serif;
      font-size: clamp(2rem, 6vw, 3.8rem);
      color: var(--rust);
      line-height: 1.1;
    }

    header p {
      margin-top: 0.75rem;
      font-style: italic;
      color: #6b5a3e;
      font-size: 1rem;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .controls button {
      font-family: 'Lora', serif;
      font-size: 0.85rem;
      padding: 0.45rem 1.1rem;
      border: 2px solid var(--ink);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.2s, color 0.2s;
    }

    .controls button:hover { background: var(--ink); color: var(--cream); }
    .controls button.active { background: var(--rust); border-color: var(--rust); color: white; }

    #places-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }
    /*this is the grid that auto fills without any queries*/
    /* ── Card wrapper ── */
    .place-card {
      position: relative;
      height: 220px;
      overflow: hidden;
      border: 1px solid rgba(26,18,8,0.12);
      border-top: 4px solid var(--rust);
      border-radius: 2px;
      box-shadow: 3px 3px 0 var(--shadow);
      cursor: pointer;
      opacity: 0;
      transform: translateY(18px);
      animation: fadeUp 0.4s forwards;
      transition: box-shadow 0.18s ease, border-top-color 0.3s ease;
    }

    .place-card:hover { box-shadow: 5px 6px 0 var(--shadow); }

    .place-card.highlighted { border-top-color: var(--gold); }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
    /*cards start invisible and low and then fade up. fixed height card*/
    /* ── FRONT face ── */
    .card-front {
      position: absolute;
      inset: 0;
      background: var(--card-bg);
      padding: 1.4rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      transform: translateY(0%);
    }
    /*fills the card until open class is added*/
    .place-card.open .card-front {
      transform: translateY(-100%);
    }

    /* ── BACK face (drawer slides up) ── */
    .card-back {
      position: absolute;
      inset: 0;
      background: var(--back-bg);
      color: var(--cream);
      padding: 1.2rem 1.5rem 1.4rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      transform: translateY(100%);
      transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /*back starts hidden. it opens like a drawer opens*/
    .place-card.open .card-back {
      transform: translateY(0%);
    }
  /*for fun, a bell sounds with guardrales for old browsers*/
    .place-card.highlighted .card-back { background: #2a1f08; }

    /* ── Front content ── */
    .card-bell { font-size: 1.6rem; margin-bottom: 0.4rem; }

    .card-name {
      font-family: 'Abril Fatface', serif;
      font-size: 1.7rem;
      color: var(--rust);
      line-height: 1.1;
    }

    .card-state {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--sage);
      font-weight: 600;
      margin-top: 0.3rem;
      margin-bottom: 1rem;
    }

    .card-hint {
      font-size: 0.78rem;
      font-style: italic;
      color: #9a8060;
      margin-top: auto;
    }

    .card-hint::after { content: ' ↑'; font-style: normal; }

    /* ── Back content ── */
    .back-name {
      font-family: 'Abril Fatface', serif;
      font-size: 1rem;
      color: var(--gold);
      margin-bottom: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .back-population {
      font-size: 0.78rem;
      color: #a09070;
      font-style: italic;
      margin-bottom: 0.85rem;
    }

    .back-population span {
      font-style: normal;
      color: var(--cream);
      font-weight: 600;
    }

    .back-fact {
      font-size: 0.88rem;
      line-height: 1.65;
      color: #e8e0d0;
      border-left: 3px solid var(--rust);
      padding-left: 0.85rem;
    }

    .back-close {
      font-size: 0.72rem;
      color: #6b5a3e;
      margin-top: auto;
      padding-top: 0.6rem;
      font-style: italic;
    }

    .back-close::after { content: ' ↓'; font-style: normal; }

    #status-message {
      text-align: center;
      font-style: italic;
      color: #6b5a3e;
      padding: 2rem;
    }

    footer {
      text-align: center;
      margin-top: 3.5rem;
      font-size: 0.78rem;
      color: #9a8060;
      font-style: italic;
      border-top: 1px solid rgba(26,18,8,0.1);
      padding-top: 1.5rem;
    }

    .place-card:nth-child(1)  { animation-delay: 0.05s; }
    .place-card:nth-child(2)  { animation-delay: 0.10s; }
    .place-card:nth-child(3)  { animation-delay: 0.15s; }
    .place-card:nth-child(4)  { animation-delay: 0.20s; }
    .place-card:nth-child(5)  { animation-delay: 0.25s; }
    .place-card:nth-child(6)  { animation-delay: 0.30s; }
    .place-card:nth-child(7)  { animation-delay: 0.35s; }
    .place-card:nth-child(8)  { animation-delay: 0.40s; }
    .place-card:nth-child(9)  { animation-delay: 0.45s; }
    .place-card:nth-child(10) { animation-delay: 0.50s; }
    .place-card:nth-child(n+11) { animation-delay: 0.55s; }
  </style>
</head>

<body>

  <header>
    <h1>Weird &amp; Wonderful<br>US Place Names</h1>
    <p>Real towns. Real names. Click a card to learn more.</p>
  </header>

  <div class="controls">
    <button id="btn-highlight-all" class="active">✦ Highlight All</button>
    <button id="btn-clear">Clear Highlights</button>
    <button id="btn-sort-name">Sort A–Z</button>
    <button id="btn-sort-pop">Sort by Population</button>
  </div>

  <div id="status-message">Loading places...</div>
  <div id="places-container"></div>

  <footer>
    Data loaded via jQuery AJAX &middot; All places are real &middot; Click any card to reveal its story
  </footer>

  <script>

    // ─────────────────────────────────────────────
    // Ding Dong Bell Sound using Web Audio API
    // No audio file needed — generated in the browser
    // ─────────────────────────────────────────────
    // This is where the bell is coded. fades like a real bell
    function playBell() {
      try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();

        function tone(freq, startTime, duration, gain) {
          var osc      = ctx.createOscillator();
          var gainNode = ctx.createGain();
          osc.connect(gainNode);
          gainNode.connect(ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, startTime);
          gainNode.gain.setValueAtTime(gain, startTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          osc.start(startTime);
          osc.stop(startTime + duration);
        }

        var now = ctx.currentTime;
        tone(880, now,        1.2, 0.5);   // Ding (A5)
        tone(659, now + 0.45, 1.2, 0.4);   // Dong (E5)

      } catch(e) {
        // Web Audio not supported — silently skip
      }
    }

    // ─────────────────────────────────────────────
    // Custom jQuery Plugin: $.fn.weirdHighlight
    // Adds/toggles a highlighted class with optional
    // flash effect. Reusable and chainable.
    // ─────────────────────────────────────────────
    // and here is where we start jQuery
    $.fn.weirdHighlight = function(options) {
      var settings = $.extend({
        toggle: true,
        flash:  false
      }, options);
  
      return this.each(function() {
        var $el = $(this);

        if (settings.flash) {
          $el.css('transform', 'scale(1.03)');
          setTimeout(function() { $el.css('transform', ''); }, 150);
        }
    // claude tells me this is what makes the plugin act like a real plugin with this
        if (settings.toggle) {
          $el.toggleClass('highlighted');
        } else {
          $el.addClass('highlighted');
        }
      });
    };

    // ─────────────────────────────────────────────
    // Data store
    // ─────────────────────────────────────────────
    var placesData = [];

    // ─────────────────────────────────────────────
    // Build one card (front + sliding back drawer)
    // ─────────────────────────────────────────────
    function buildCard(place) {
      var popDisplay = place.population
        ? place.population.toLocaleString()
        : 'Unknown';

      var isDingDong = (place.name === 'Ding Dong');

      // Front face
      var $front = $('<div>', { class: 'card-front' });
      if (isDingDong) {
        $front.append($('<div>', { class: 'card-bell', text: '🔔' }));
      }
      $front.append(
        $('<div>', { class: 'card-name',  text: place.name  }),
        $('<div>', { class: 'card-state', text: place.state }),
        $('<div>', { class: 'card-hint',  text: 'Click for the story' })
      );

      // Back face
      var $back = $('<div>', { class: 'card-back' }).append(
        $('<div>', { class: 'back-name', text: place.name + ', ' + place.state }),
        $('<div>', { class: 'back-population' }).html(
          'Population: <span>' + popDisplay + '</span>'
        ),
        $('<div>', { class: 'back-fact',  text: place.fun_fact }),
        $('<div>', { class: 'back-close', text: 'Click to close' })
      );

      // Card wrapper with click handler
      var $card = $('<div>', { class: 'place-card' })
        .append($front, $back)
        .on('click', function() {
          $(this).toggleClass('open');
          if (isDingDong && $(this).hasClass('open')) {
            playBell();
          }
        });

      return $card;
    }
    // jQuery creates new DOM elements and front built piece by piece
    // back face is built the same way
    // the card wrapper gets both faces and a click handler is chainded on
    // render cards clears the old cards before re-rendering.
    // ─────────────────────────────────────────────
    // Render all cards from placesData
    // ─────────────────────────────────────────────
    function renderCards() {
      var $container = $('#places-container').empty();
      $.each(placesData, function(i, place) {
        $container.append(buildCard(place));
      });
      $('.place-card').weirdHighlight({ toggle: false, flash: false });
    }
    // so the placesData command places an empty array outside of functions so that it is global
    // ─────────────────────────────────────────────
    // jQuery AJAX — load the local JSON file
    // ─────────────────────────────────────────────
    // You may be old enough to remember when Ajax was a household cleaner?
    // Claude states this is a great way to remember it as it cuts through waiting
    $.ajax({
      url: 'places.json',
      dataType: 'json',
      success: function(data) {
        $('#status-message').hide();
        placesData = data;
        renderCards();
      },
      error: function(jqXHR, textStatus, errorThrown) {
        $('#status-message').text(
          'Could not load places.json. Make sure both files are in the same folder ' +
          'and you\'re running Live Server. (' + textStatus + ')'
        );
        console.error('AJAX error:', textStatus, errorThrown);
      }
    });
    // No manual JSON/parse needed
    // ─────────────────────────────────────────────
    // Control buttons
    // ─────────────────────────────────────────────
    $('#btn-highlight-all').on('click', function() {
      $(this).addClass('active');
      $('#btn-clear').removeClass('active');
      $('.place-card').weirdHighlight({ toggle: false, flash: true });
    });

    $('#btn-clear').on('click', function() {
      $(this).addClass('active');
      $('#btn-highlight-all').removeClass('active');
      $('.place-card').removeClass('highlighted');
    });

    $('#btn-sort-name').on('click', function() {
      placesData.sort(function(a, b) { return a.name.localeCompare(b.name); });
      renderCards();
    });

    $('#btn-sort-pop').on('click', function() {
      placesData.sort(function(a, b) { return (a.population || 0) - (b.population || 0); });
      renderCards();
    });
    // these are the button commands with native.sort, localecompare, substraction, etc
  </script>
</body>
</html>
